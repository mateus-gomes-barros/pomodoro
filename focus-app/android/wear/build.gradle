apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.mateusgomes.focusapp.pulse"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.mateusgomes.focusapp"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeVersion = '1.10.5'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.compose.ui:ui:$composeVersion"
    implementation "androidx.compose.ui:ui-tooling-preview:$composeVersion"
    implementation "androidx.compose.foundation:foundation:$composeVersion"
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.wear:wear-ongoing:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear.compose:compose-material3:1.6.2'
    implementation 'androidx.wear.tiles:tiles:1.6.0'
    implementation 'androidx.wear.protolayout:protolayout:1.4.0'
    implementation 'com.google.guava:guava:33.4.8-android'

    debugImplementation "androidx.compose.ui:ui-tooling:$composeVersion"
}
