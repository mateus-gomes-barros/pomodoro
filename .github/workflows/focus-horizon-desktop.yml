name: Focus Horizon Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "focus-app/**"
      - ".github/workflows/focus-horizon-desktop.yml"
  push:
    branches:
      - feat/focus-horizon-desktop
    paths:
      - "focus-app/**"
      - ".github/workflows/focus-horizon-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            name: macOS-Apple-Silicon
            rust-target: aarch64-apple-darwin
            args: --bundles dmg --target aarch64-apple-darwin
          - platform: macos-15-intel
            name: macOS-Intel
            rust-target: x86_64-apple-darwin
            args: --bundles dmg --target x86_64-apple-darwin
          - platform: windows-latest
            name: Windows
            rust-target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: focus-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: focus-app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npm run desktop:prepare

      - name: Build desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          projectPath: focus-app
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: focus-horizon-${{ matrix.name }}
          if-no-files-found: error
          path: |
            focus-app/src-tauri/target/**/release/bundle/dmg/*.dmg
            focus-app/src-tauri/target/**/release/bundle/nsis/*.exe
            focus-app/src-tauri/target/**/release/bundle/msi/*.msi
